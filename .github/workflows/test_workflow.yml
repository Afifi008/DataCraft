name: test
on: push
env:
  MONGO_HOST: cluster0.qafqccp.mongodb.net
  MONGO_DB: 'DataCraft_DB'
  MONGO_USER: ${{secrets.MONGO_USER}}
  MONGO_PASSWORD: ${{secrets.MONGO_PASSWORD}}

jobs:
  test:
    uses: './.github/workflows/test_job.yml'
    with:
      python_version : '3.11'
      test_case: 'tests/test_dag_integrity_win.py'
      
  show_results:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: show results
        run: |
          echo "test status = ${{needs.test.outputs.test_status}}"
          echo "Number of Rows= ${{needs.test.outputs.row_count}}"
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: get code 
        uses: actions/checkout@v7
      - name: insatall python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: cacheing step
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: req-$${{hashFiles('requirements.txt')}}
      - name: setup requirements
        run: pip install -r requirements.txt
      - name: build artifact
        run: python build_output.py
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Datacraft_artifact
          path: artifact/*.csv
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: get code 
        uses: actions/checkout@v7
      - name: insatall python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: cacheing step
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: req-$${{hashFiles('requirements.txt')}}
      - name: setup requirements
        run: pip install -r requirements.txt
      - name: download artifact
        uses: actions/download-artifact@v4
        with:
          name: Datacraft_artifact
          path: data/
      - name: list files in data folder
        run: |
          cd data/
          ls
      - name: Deploy to mongo
        run: python deploy_to_mongo.py
      - name: print deploy
        run: echo "deploy"
